name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # publishing releases for tags
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y g++-multilib zip shellcheck
      - run: tools/dist.sh ${TAG:+"$TAG"}
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - id: zip
        run: echo "name=$(basename dist/*.zip .zip)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: build/dist/
      - if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
